# Engine manifest — llama.cpp auxiliary instance #1 — generic baseline
#
# Member of the llamacpp-aux-1/2/3/4 family. Same binary as the main
# ``llamacpp`` (8080), different model bound at launch via a separate
# symlink path (``llms/gguf/aux1/active.gguf``) so the four instances
# coexist on the host without process-pattern cross-match.
#
# Port assignment convention (Hermes Agent multi-role aux stack):
#   llamacpp-aux-1  8090  (primary aux, biggest model, highest concurrency)
#   llamacpp-aux-2  8091  (medium aux)
#   llamacpp-aux-3  8092  (small aux, single-flow)
#   llamacpp-aux-4  8093  (vision aux, single-flow + mmproj)
#
# This baseline targets a generic out-of-the-box install. For pre-tuned
# configurations (e.g. Qwen3-4B-Instruct multi-role for Hermes Agent),
# see the preset files under ``data/engine_manifests/presets/``.
#   aisctl install llamacpp-aux-1 --preset <preset-name>

name = "llamacpp-aux-1"
display = "llama.cpp aux #1 (port 8090, primary aux slot)"

[binary]
candidates = [
    "/opt/homebrew/bin/llama-server",
    "/usr/local/bin/llama-server",
]
# Discriminates aux-1 from peers (aux-2/3/4) and from main (llamacpp) via
# the model path in cmdline. ``pgrep``/``pkill`` will match this literal
# substring; the four aux-N patterns are mutually exclusive thanks to the
# trailing digit in the ``auxN/`` segment, and disjoint from the main
# manifest's ``llms/gguf/active.gguf``.
process_pattern = "llms/gguf/aux1/active.gguf"
# User-managed symlink. Convention:
#   ln -sf ~/llms/gguf/aux1/<your-model>.gguf ~/llms/gguf/aux1/active.gguf
model_path = "~/llms/gguf/aux1/active.gguf"
# Generic baseline flags. Use a preset for tuned configurations.
program_args = [
    "--cont-batching",
    "--flash-attn", "on",
    "--mlock",
    "--n-gpu-layers", "999",
    "--jinja",
]
builds_from_source = false

[plist]
name = "com.asiai.llamacpp-aux-1"
throttle_interval = 10
timeout = 30

[network]
port = 8090
bind = "0.0.0.0"
health_endpoint = "/health"
health_timeout = 30

[firewall]
supported = true
anchor_name = "com.asiai.llamacpp-aux-1"

[logs]
dir = "~/Library/Logs/asiai/llamacpp-aux-1"
stdout = "llamacpp-aux-1.log"
stderr = "llamacpp-aux-1.err"

[wrapper]
needed = false

[environment]
vars = []
