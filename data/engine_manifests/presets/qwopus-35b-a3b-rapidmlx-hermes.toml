# Example preset — Qwopus3.6-35B-A3B-v1 MoE (Jackrong finetune of Qwen3.6-35B-A3B)
# served by Rapid-MLX for Hermes Agent
#
# This is an EXAMPLE preset adapted for the Hermes Agent class. Copy and
# edit for your own orchestrator, or override locally via $XDG_CONFIG_HOME.
#
# Target role: Best-of-both-worlds candidate combining the Qwen3.6
# 35B-A3B MoE speed advantage (~107 tok/s decode on M5 via Rapid-MLX)
# with the Qwopus SFT-finetune reasoning quality boost (+SWE-bench /
# MMLU-Pro vs base 35B-A3B per Jackrong's published evals).
#
# Target hardware: Apple Silicon M-series with 64+ GB unified memory.
#   ~20 GB MLX-4bit on disk + working set per Rapid-MLX advisory.
# Target model: HuggingFace ``zaydiscold/Qwopus3.6-35B-A3B-v1-MLX-4bit``
#   (community MLX conversion of Jackrong/Qwopus3.6-35B-A3B-v1, ~355 DL
#   on HF as of 2026-05-23).
#
# Rapid-MLX accepts the full HF repo id as positional model arg —
# first-run downloads the MLX shards from HF Hub (~20 GB).
#
# Caveat (upstream HF Qwopus model card):
#   - Greedy decoding (temp ≈ 0) on Qwopus may cause infinite ``<think>``
#     loops. Use temperature=1.0 in client requests.
#
# Install: aisctl install rapidmlx --preset qwopus-35b-a3b-rapidmlx-hermes

name = "rapidmlx"
display = "Rapid-MLX (Qwopus3.6-35B-A3B-v1 MoE MLX-4bit, Hermes Agent preset)"

[binary]
candidates = [
    "/opt/homebrew/bin/rapid-mlx",
    "/usr/local/bin/rapid-mlx",
]
process_pattern = "rapid-mlx serve"
program_args = [
    "serve",
    "zaydiscold/Qwopus3.6-35B-A3B-v1-MLX-4bit",
]
builds_from_source = false

[plist]
name = "com.asiai.rapidmlx"
throttle_interval = 15
timeout = 120

[network]
port = 8004
bind = "0.0.0.0"
health_endpoint = "/v1/models"
# 180s on first start: ~20 GB MLX shard download from HF Hub.
health_timeout = 180

[firewall]
supported = true
anchor_name = "com.asiai.rapidmlx"

[logs]
dir = "~/Library/Logs/asiai/rapidmlx"
stdout = "rapidmlx-stdout.log"
stderr = "rapidmlx-stderr.log"

[wrapper]
needed = false

[environment]
vars = []
