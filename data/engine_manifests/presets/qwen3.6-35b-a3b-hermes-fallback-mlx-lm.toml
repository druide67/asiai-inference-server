# Example preset — Qwen3.6-35B-A3B served by mlx-lm for Hermes Agent fallback
#
# This is an EXAMPLE preset adapted for the Hermes Agent class of
# orchestrator (see README.md in this directory). Copy and edit for your
# own orchestrator, or override locally via $XDG_CONFIG_HOME.
#
# Target role: FALLBACK on a 64 GB host. When the PRIMARY endpoint
#   (a larger machine running a heavier model) is unreachable, the
#   orchestrator routes to this endpoint.
# Target hardware: Apple Silicon M-series with 64+ GB unified memory.
# Target use case: Hermes Agent class — multi-turn agentic sessions.
#   mlx-lm provides contiguous prefix cache reuse (the metric that makes
#   multi-turn agentic viable on slower hardware), so the fallback tick
#   stays under ~10 min on M4 Pro even with decode ~53 tok/s on this MoE.
# Target model: Qwen3.6-35B-A3B (sparse MoE, ~3B active, ~35B parameters).
#   MLX-4bit quant: unsloth/Qwen3.6-35B-A3B-UD-MLX-4bit (~20 GB on disk).
#   Symlink ~/llms/mlx/active → your chosen MLX directory so the wrapper's
#   default MLXLM_MODEL path resolves automatically. Alternatively override
#   via the MLXLM_MODEL environment variable at install time.
#
# Bench reference (2026-05-18, Apple Silicon M4 Pro 64 GB):
#   mlx-lm 0.31.3 + 35B-A3B MLX-4bit
#     TTFT cold       9.1 s
#     TTFT prefix-hit 2.16 s  (prefix cache reuse YES)
#     Decode short    53.2 tok/s
#     Decode 50K      37.4 tok/s
#     Tick Hermes     ~10 min/cycle (60 calls × 400 tok)
#
# Security: mlx-lm's server warns "not recommended for production" — it
# implements basic security checks only. Operators exposing it past
# loopback should front it with a reverse proxy (bearer auth, rate-limit,
# audit). The MVP driver assumes LAN-only deployment via pf anchor.
# A reverse proxy preset is tracked as a follow-up user story.
#
# Install: aisctl install mlx-lm --preset qwen3.6-35b-a3b-hermes-fallback-mlx-lm

name = "mlx-lm"
display = "mlx-lm (Qwen3.6-35B-A3B Hermes Fallback preset)"

[binary]
candidates = [
    "/usr/local/bin/mlx-lm-server-start",
    "/opt/homebrew/bin/mlx-lm-server-start",
]
process_pattern = "mlx_lm.server"
# Tuning rationale:
# - mlx-lm has a much smaller flag surface than llama-server. The wrapper
#   forwards --model, --host, --port and exposes optional env-driven
#   overrides for python interpreter discovery. Tunable knobs like
#   max-tokens or temperature are passed per-request via the OpenAI API,
#   not baked into the daemon command line.
# - mlx-lm's prefix cache is structured (sequences per role) and enabled
#   by default. No flag toggles it on/off as of 0.31.3.
# - HF_HUB_CACHE is auto-created by the wrapper before starting the
#   server (mlx-lm crashes if the directory is missing).
# - Sampling defaults (mlx-lm 0.31.x): temperature=1.0, top_p=1.0,
#   top_k=0 — these are the upstream defaults if a client omits them.
#   Qwen3.6 thinking-mode recommendations are temperature=0.6, top_p=0.95,
#   top_k=20. Configure the orchestrator (e.g. Hermes) to send these
#   per-request — they cannot be baked into the daemon command line.
# - Pre-install check: ``lsof -nP -iTCP:8000 -sTCP:LISTEN`` should be
#   empty before ``aisctl install``. vllm-mlx and any other engine that
#   defaults to 8000 cannot coexist on the same host.
program_args = []
builds_from_source = false

[plist]
name = "com.asiai.mlx-lm"
throttle_interval = 15
# 60s leaves room to mmap the ~20 GB MLX-4bit quant and warm caches.
timeout = 60

[network]
port = 8000
bind = "0.0.0.0"
health_endpoint = "/v1/models"
health_timeout = 60

[firewall]
supported = true
anchor_name = "com.asiai.mlx-lm"

[logs]
dir = "~/Library/Logs/asiai/mlx-lm"
stdout = "mlx-lm-stdout.log"
stderr = "mlx-lm-stderr.log"

[wrapper]
needed = true
install_path = "/usr/local/bin/mlx-lm-server-start"

[environment]
# MLXLM_MODEL: the wrapper passes this as ``--model``. The path may be a
# local MLX directory (preferred for offline/LAN deployments) or a HF
# repo id (will download on first start).
# MLXLM_PYTHON: optional, override the wrapper's auto-discovery of the
# venv python interpreter. Useful when the venv lives outside the
# default search paths.
vars = [
    "MLXLM_MODEL=~/llms/mlx/Qwen3.6-35B-A3B-UD-MLX-4bit",
]
# Promoted from the header comment above (~20 GB MLX-4bit on disk; MLX
# weights are mmapped so disk size ~= resident weights).
[memory]
weights_mb = 20480.0
