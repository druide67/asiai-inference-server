# Example preset — Qwen3.6-35B-A3B (MoE) served by Rapid-MLX for Hermes Agent
#
# This is an EXAMPLE preset adapted for the Hermes Agent class. Copy and
# edit for your own orchestrator, or override locally via $XDG_CONFIG_HOME.
#
# Target role: Comparison point against the production llamacpp +
# 35B-A3B GGUF preset (qwen3.6-35b-a3b-hermes-agent-64gb). Same model
# family, different engine — measures the snapshots-RNN claim on MoE
# A3B + DeltaNet hybrid (matched against ~80 tok/s decode on llamacpp).
#
# Target hardware: Apple Silicon M-series with 64+ GB unified memory.
#   ~20 GB MLX-4bit on disk + working set per Rapid-MLX advisory.
# Target model: Rapid-MLX alias ``qwen3.6-35b-ud`` resolves internally
#   to ``unsloth/Qwen3.6-35B-A3B-UD-MLX-4bit``. First-run downloads from
#   HF Hub (~20 GB).
#
# Install: aisctl install rapidmlx --preset qwen3.6-35b-a3b-rapidmlx-hermes

name = "rapidmlx"
display = "Rapid-MLX (Qwen3.6-35B-A3B MoE MLX-4bit, Hermes Agent preset)"

[binary]
candidates = [
    "/opt/homebrew/bin/rapid-mlx",
    "/usr/local/bin/rapid-mlx",
]
process_pattern = "rapid-mlx serve"
program_args = [
    "serve",
    "qwen3.6-35b-ud",
]
builds_from_source = false

[plist]
name = "com.asiai.rapidmlx"
throttle_interval = 15
timeout = 90

[network]
port = 8004
bind = "0.0.0.0"
health_endpoint = "/v1/models"
# 120s on first start: Rapid-MLX may download ~20 GB MLX shards.
health_timeout = 120

[firewall]
supported = true
anchor_name = "com.asiai.rapidmlx"

[logs]
dir = "~/Library/Logs/asiai/rapidmlx"
stdout = "rapidmlx-stdout.log"
stderr = "rapidmlx-stderr.log"

[wrapper]
needed = false

[environment]
vars = []
