# Engine manifest — llama.cpp (llama-server) — generic baseline
#
# Upstream: https://github.com/ggml-org/llama.cpp
# Binary:   llama-server (installed via ``brew install llama.cpp``)
#
# This baseline targets a generic out-of-the-box install. The user supplies
# their own GGUF via the hard link at ``model_path``, and llama-server's
# embedded chat template handles prompting.
#
# For pre-tuned configurations targeting specific models and use cases
# (e.g. Qwen3.6-35B-A3B agentic workloads on M-series Macs), see the
# preset files under ``data/engine_manifests/presets/``. Install with:
#   aisctl install llamacpp --preset <preset-name>

name = "llamacpp"
display = "llama.cpp (llama-server)"

[binary]
candidates = [
    "/opt/homebrew/bin/llama-server",
    "/usr/local/bin/llama-server",
]
# Discriminates the main instance (8080) from the llamacpp-aux-1/2/3/4
# family (8090-8093) by the model path in cmdline. The auxN/ segments
# break the substring match in both directions — see
# test_llamacpp_and_aux_process_patterns_are_disjoint.
process_pattern = "llms/gguf/active.gguf"
# User-managed HARD link to the active GGUF (same APFS volume). Convention:
#   ln -f ~/llms/gguf/<MyModel>.gguf ~/llms/gguf/active.gguf
# Re-link + ``aisctl restart llamacpp`` to switch models. A hard link pins
# the INODE: re-run ``ln -f`` after replacing the source file (re-download,
# rename-in-place), or active.gguf silently keeps serving the old bytes.
# A SYMLINK here still installs (it is resolved to its real target before the
# privileged helper, which refuses symlinked model files by design), but the
# daemon's command line then carries the real path — process_pattern above
# stops matching and state detection goes blind. Hard link or real path only.
model_path = "~/llms/gguf/active.gguf"
# Generic baseline flags. Use a preset for tuned configurations.
# --host/--port are emitted automatically from [network] (do not duplicate).
# --model is injected from model_path above.
program_args = [
    "--cont-batching",
    "--flash-attn", "on",
    "--mlock",
    "--n-gpu-layers", "999",
    "--jinja",
]
builds_from_source = false
# Non-loopback binds should carry auth. llama-server reads its API key(s)
# from a file (one key per line, '#' comments) so the key value never
# appears in the generated plist (world-readable) or in `ps` output —
# only the path does. Create the file yourself (mode 600, owned by the
# account the daemon runs as), then uncomment BOTH this field and
# [network].api_key_file below:
#   mkdir -p ~/.config/asiai-inference-server
#   umask 177 && printf '%s\n' "$(openssl rand -hex 32)" \
#     > ~/.config/asiai-inference-server/backend-api-key
# api_key_file = "~/.config/asiai-inference-server/backend-api-key"

[plist]
name = "com.asiai.llamacpp"
throttle_interval = 10
timeout = 30

[network]
port = 8080
bind = "0.0.0.0"
health_endpoint = "/health"
# 60s because loading a large GGUF and mlock-ing memory can take 30-45s
# on M-series unified memory. Smaller models load faster but the ceiling
# is what matters for the baseline.
health_timeout = 60
# Companion of [binary].api_key_file (uncomment together): lets the aisrv
# generation probe authenticate. llama-server keeps /health, /v1/health,
# /models and /v1/models public even with a key, so the health probe needs
# none — but /v1/chat/completions (the generation probe) is gated. When
# shared with the probe, the file must hold exactly ONE key line and no
# comments: the probe sends the whole file content (stripped) as the
# Bearer token.
# api_key_file = "~/.config/asiai-inference-server/backend-api-key"

[firewall]
supported = true
anchor_name = "com.asiai.llamacpp"

[logs]
dir = "~/Library/Logs/asiai/llamacpp"
stdout = "llamacpp.log"
stderr = "llamacpp.err"

[wrapper]
needed = false

[environment]
vars = []
