# Engine manifest — llama.cpp (llama-server) — generic baseline
#
# Upstream: https://github.com/ggml-org/llama.cpp
# Binary:   llama-server (installed via ``brew install llama.cpp``)
#
# This baseline targets a generic out-of-the-box install. The user supplies
# their own GGUF via the symlink at ``model_path``, and llama-server's
# embedded chat template handles prompting.
#
# For pre-tuned configurations targeting specific models and use cases
# (e.g. Qwen3.6-35B-A3B agentic workloads on M-series Macs), see the
# preset files under ``data/engine_manifests/presets/``. Install with:
#   aisctl install llamacpp --preset <preset-name>

name = "llamacpp"
display = "llama.cpp (llama-server)"

[binary]
candidates = [
    "/opt/homebrew/bin/llama-server",
    "/usr/local/bin/llama-server",
]
# Discriminates the main instance (8080) from llamacpp-aux (8082) by the
# model path in cmdline. The /aux/ segment breaks the substring match in
# both directions — see test_llamacpp_and_aux_process_patterns_are_disjoint.
process_pattern = "llms/gguf/active.gguf"
# User-managed symlink to the active GGUF. Convention:
#   ln -sf ~/llms/gguf/<MyModel>.gguf ~/llms/gguf/active.gguf
# Re-link + ``aisctl restart llamacpp`` to switch models.
model_path = "~/llms/gguf/active.gguf"
# Generic baseline flags. Use a preset for tuned configurations.
# --host/--port are emitted automatically from [network] (do not duplicate).
# --model is injected from model_path above.
program_args = [
    "--cont-batching",
    "--flash-attn", "on",
    "--mlock",
    "--n-gpu-layers", "999",
    "--jinja",
]
builds_from_source = false

[plist]
name = "com.asiai.llamacpp"
throttle_interval = 10
timeout = 30

[network]
port = 8080
bind = "0.0.0.0"
health_endpoint = "/health"
# 60s because loading a large GGUF and mlock-ing memory can take 30-45s
# on M-series unified memory. Smaller models load faster but the ceiling
# is what matters for the baseline.
health_timeout = 60

[firewall]
supported = true
anchor_name = "com.asiai.llamacpp"

[logs]
dir = "~/Library/Logs/asiai/llamacpp"
stdout = "llamacpp.log"
stderr = "llamacpp.err"

[wrapper]
needed = false

[environment]
vars = []
