# Engine manifest — llama.cpp auxiliary instance #5 — generic baseline
#
# Member of the llamacpp-aux-1/2/3/4/5 family. See ``llamacpp-aux-1.toml``
# for the family rationale and port assignment convention.
#
# Slot #5 is typically used for a *single-flow long-context* role
# (compression, summarisation, RAG retrieval) where parallel=1 +
# ctx_total ≥ 200K is desirable. The 8094 port is dedicated so the
# main multi-role aux on 8090 keeps its parallel=4 burst capacity for
# fast turns while 8094 absorbs the long-prompt single-flow.
#
#   aisctl install llamacpp-aux-5 --preset <preset-name>

name = "llamacpp-aux-5"
display = "llama.cpp aux #5 (port 8094, single-flow long-context slot)"

[binary]
candidates = [
    "/opt/homebrew/bin/llama-server",
    "/usr/local/bin/llama-server",
]
process_pattern = "llms/gguf/aux5/active.gguf"
model_path = "~/llms/gguf/aux5/active.gguf"
program_args = [
    "--cont-batching",
    "--flash-attn", "on",
    "--mlock",
    "--n-gpu-layers", "999",
    "--jinja",
]
builds_from_source = false
# Non-loopback binds should carry auth. llama-server reads its API key(s)
# from a file (one key per line, '#' comments) so the key value never
# appears in the generated plist (world-readable) or in `ps` output —
# only the path does. Create the file yourself (mode 600, owned by the
# account the daemon runs as), then uncomment BOTH this field and
# [network].api_key_file below:
#   mkdir -p ~/.config/asiai-inference-server
#   umask 177 && printf '%s\n' "$(openssl rand -hex 32)" \
#     > ~/.config/asiai-inference-server/backend-api-key
# api_key_file = "~/.config/asiai-inference-server/backend-api-key"

[plist]
name = "com.asiai.llamacpp-aux-5"
throttle_interval = 10
# 60s: long-context single-flow can mlock larger model + KV than the
# burst slots, allow extra warmup.
timeout = 60

[network]
port = 8094
bind = "0.0.0.0"
health_endpoint = "/health"
health_timeout = 60
# Companion of [binary].api_key_file (uncomment together): lets the aisrv
# generation probe authenticate. llama-server keeps /health, /v1/health,
# /models and /v1/models public even with a key, so the health probe needs
# none — but /v1/chat/completions (the generation probe) is gated. When
# shared with the probe, the file must hold exactly ONE key line and no
# comments: the probe sends the whole file content (stripped) as the
# Bearer token.
# api_key_file = "~/.config/asiai-inference-server/backend-api-key"

[firewall]
supported = true
anchor_name = "com.asiai.llamacpp-aux-5"

[logs]
dir = "~/Library/Logs/asiai/llamacpp-aux-5"
stdout = "llamacpp-aux-5.log"
stderr = "llamacpp-aux-5.err"

[wrapper]
needed = false

[environment]
vars = []
