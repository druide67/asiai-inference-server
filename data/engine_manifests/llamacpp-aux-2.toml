# Engine manifest — llama.cpp auxiliary instance #2 — generic baseline
#
# Member of the llamacpp-aux-1/2/3/4 family. See ``llamacpp-aux-1.toml``
# for the family rationale and port assignment convention.
#
#   aisctl install llamacpp-aux-2 --preset <preset-name>

name = "llamacpp-aux-2"
display = "llama.cpp aux #2 (port 8091, medium aux slot)"

[binary]
candidates = [
    "/opt/homebrew/bin/llama-server",
    "/usr/local/bin/llama-server",
]
process_pattern = "llms/gguf/aux2/active.gguf"
model_path = "~/llms/gguf/aux2/active.gguf"
program_args = [
    "--cont-batching",
    "--flash-attn", "on",
    "--mlock",
    "--n-gpu-layers", "999",
    "--jinja",
]
builds_from_source = false

[plist]
name = "com.asiai.llamacpp-aux-2"
throttle_interval = 10
timeout = 30

[network]
port = 8091
bind = "0.0.0.0"
health_endpoint = "/health"
health_timeout = 30

[firewall]
supported = true
anchor_name = "com.asiai.llamacpp-aux-2"

[logs]
dir = "~/Library/Logs/asiai/llamacpp-aux-2"
stdout = "llamacpp-aux-2.log"
stderr = "llamacpp-aux-2.err"

[wrapper]
needed = false

[environment]
vars = []
