# Engine manifest — Rapid-MLX
# Third-party MLX-based OpenAI-compatible inference server for Apple Silicon
# (github.com/raullenchai/Rapid-MLX).
#
# Key property — Rapid-MLX is the only known engine implementing
# cross-USER prefix cache reuse on Qwen3.6 hybrid-attention models
# (Gated DeltaNet + full_attention layers). Achieved via "snapshots RNN"
# that save and restore the linear-attention layer state in ~0.1 ms.
# Validated empirically on M5 Max + Qwen3.6-27B-UD-MLX-4bit 2026-05-23:
# TTFT prefix-test 283-2435 ms vs TTFT cold 8954 ms (17x faster).
#
# Reference benchmarks for context: llama.cpp ``--cache-reuse`` is
# silently disabled on hybrid arch (``llama_memory_can_shift=false``);
# mlx-lm hybrid prefix cache is broken (issue ml-explore/mlx-lm#980);
# oMLX tool-calling breaks on cache hit (issue jundot/omlx#825).
#
# [security] Rapid-MLX is a community project. The MVP driver assumes
# LAN-only deployment behind a pf anchor. No auth integration yet —
# tracked as a follow-up user story when productizing beyond local use.
#
# Like mlx-lm, the engine has no native CLI binary — ``rapid-mlx serve``
# is a Python entry-point. We install a shell wrapper at
# ``/usr/local/bin/rapid-mlx-server-start`` that resolves the binary in
# PATH (or in pip/brew install dirs) and execs the ``serve`` subcommand
# with the configured model + port.
#
# Port: 8004 — picked to leave room for mlx-lm (8000), vmlx (8003),
# llamacpp main (8080), llamacpp-aux family (8090+) without collision.
# Rapid-MLX upstream default port is also 8000 (conflicts mlx-lm), the
# offset is deliberate.

name = "rapidmlx"
display = "Rapid-MLX"

[binary]
# Rapid-MLX is a Python entry-point installed by brew or pip — the
# binary ``rapid-mlx`` is directly executable (unlike mlx-lm which
# needs a Python venv wrapper). We point straight at it. Install via
# ``brew install raullenchai/rapid-mlx/rapid-mlx`` (preferred) or
# ``pip install rapid-mlx``.
candidates = [
    "/opt/homebrew/bin/rapid-mlx",
    "/usr/local/bin/rapid-mlx",
]
process_pattern = "rapid-mlx serve"
# The ``serve <model>`` invocation + flags are emitted via the preset
# (each preset declares its target model). The manifest baseline has no
# default model — adopters must install with a preset.
program_args = []
builds_from_source = false

[plist]
name = "com.asiai.rapidmlx"
throttle_interval = 15
timeout = 60

[network]
port = 8004
# Default to loopback — community engine, not hardened for unauth LAN
# exposure. Presets that want LAN access (e.g. Hermes Agent class)
# override ``bind`` to ``0.0.0.0`` and are paired with
# ``aisctl install --firewall lan-only``.
bind = "127.0.0.1"
health_endpoint = "/v1/models"
# 60s leaves room for first-run model download (Rapid-MLX caches MLX
# variants in ~/.cache/huggingface/hub on first serve).
health_timeout = 60

[firewall]
supported = true
anchor_name = "com.asiai.rapidmlx"

[logs]
dir = "~/Library/Logs/asiai/rapidmlx"
stdout = "rapidmlx-stdout.log"
stderr = "rapidmlx-stderr.log"

[wrapper]
# Rapid-MLX ships a directly-executable binary — no wrapper needed.
# (Unlike mlx-lm which requires a Python venv wrapper to invoke its
# server module.) The contrib/rapid-mlx/wrapper-start.sh.tpl template
# is kept around for hosts that may want an HF cache pre-flight env
# wrapper, but the baseline manifest does not install it.
needed = false

[environment]
# RAPIDMLX_BIN:   override binary auto-discovery (PATH > brew > pip).
# RAPIDMLX_MODEL: model alias (``qwen3.6-27b-ud``) or HF repo id (``unsloth/Qwen3.6-27B-UD-MLX-4bit``).
# RAPIDMLX_PORT:  override listening port (defaults to manifest port).
# RAPIDMLX_HOST:  bind address (defaults to manifest bind).
vars = []

[options]
# Reference defaults consumed by the wrapper at install time.
# Adopters should pin the model through a preset rather than editing this
# baseline.
default_model = "qwen3.6-27b-ud"
log_level = "info"
