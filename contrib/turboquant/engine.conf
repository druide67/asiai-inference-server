# =============================================================================
# engine.conf — Configuration TurboQuant (llama.cpp fork, KV cache turbo)
#
# Fork: https://github.com/TheTom/llama-cpp-turboquant
# Branche: feature/turboquant-kv-cache
#
# KV cache asymetrique : keys q8_0 (haute precision) + values turbo3 (5x compression)
# Permet de faire tourner Llama 70B a ~6.3 tok/s sur M4 Pro 64 Go
# =============================================================================

ENGINE_NAME="turboquant"
ENGINE_DISPLAY="TurboQuant (llama.cpp KV turbo)"

# Binaire compile localement (nom unique pour eviter conflit avec llama.cpp standard)
# BUILDS_FROM_SOURCE=true : le binaire est compile par engine_pre_setup, pas pre-installe
BUILDS_FROM_SOURCE=true
ENGINE_BIN_CANDIDATES=(
    "/usr/local/bin/llama-server-turboquant"
)

# Processus (pour pgrep -x)
ENGINE_PROCESS_PATTERN="llama-server-turboquant"

# Arguments dans le wrapper (pas ici)
ENGINE_PROGRAM_ARGS=()

# LaunchDaemon
PLIST_NAME="com.asiai.turboquant"
PLIST_THROTTLE=15
PLIST_TIMEOUT=60

# Reseau
ENGINE_PORT=8081
ENGINE_BIND="0.0.0.0"
HEALTH_ENDPOINT="/health"
HEALTH_TIMEOUT=120

# Firewall
FIREWALL_SUPPORTED=true
ANCHOR_NAME="com.turboquant"

# Logs
LOG_DIR="/var/log/turboquant"
LOG_STDOUT="turboquant.log"
LOG_STDERR="turboquant.err"

# Wrapper multi-etapes (sysctl GPU + llama-server avec args turbo)
NEEDS_WRAPPER=true
WRAPPER_TEMPLATE="wrapper-start.sh.tpl"
WRAPPER_INSTALL_PATH="/usr/local/bin/turboquant-start"

# Pas de variables d'environnement (tout est dans le wrapper via --config)
ENGINE_ENV_VARS=()
