# =============================================================================
# qwen35-turbo3.conf — Qwen 3.5 35B-A3B avec KV cache TurboQuant
#
# STATUS: NON FONCTIONNEL
# Le fork TurboQuant ne supporte pas Qwen 3.5 MoE :
#   Erreur: rope.dimension_sections: attend 4 valeurs, recoit 3
# Ce profil est en attente d'un fix upstream.
#
# Garder ce fichier pour reference — le jour ou le fork supporte Qwen MoE,
# il suffira de mettre a jour MODEL_PATH et de retester.
# =============================================================================

MODEL_PATH="/usr/local/share/turboquant/models/qwen3.5-35b-a3b.gguf"

# KV cache asymetrique
CACHE_TYPE_K="q8_0"
CACHE_TYPE_V="turbo3"

# Contexte et threads
CONTEXT_SIZE=32768
THREADS=10

# Chat template
CHAT_TEMPLATE="chatml"

# GPU memory limit (35B MoE utilise moins de VRAM que le 70B)
GPU_WIRED_MB=51200
