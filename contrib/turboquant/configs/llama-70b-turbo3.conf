# =============================================================================
# llama-70b-turbo3.conf — Llama 3.1 70B Q4_K_M avec KV cache TurboQuant
#
# Resultats benchmarks (Mac Mini M4 Pro 64 Go) :
#   - 6.3 tok/s generation
#   - 81/81 couches GPU offload
#   - ~42 Go VRAM utilises (modele + KV cache)
#
# Parametres KV cache :
#   - keys q8_0  : haute precision (les keys sont sensibles a la quantization)
#   - values turbo3 : compression 5x (finding du papier TurboQuant)
# =============================================================================

MODEL_PATH="/usr/local/share/turboquant/models/llama-3.1-70b-q4_k_m.gguf"

# KV cache asymetrique (coeur du projet TurboQuant)
CACHE_TYPE_K="q8_0"
CACHE_TYPE_V="turbo3"

# Contexte et threads
CONTEXT_SIZE=32768
THREADS=10       # M4 Pro = 10 performance cores

# Chat template (le template llama3 est buggue dans ce fork)
CHAT_TEMPLATE="chatml"

# GPU memory limit (en Mo) — sysctl iogpu.wired_limit_mb
# 61440 Mo = 60 Go (sur 64 Go total, laisse 4 Go pour l'OS)
GPU_WIRED_MB=61440
